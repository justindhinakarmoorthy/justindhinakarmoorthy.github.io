cv:
  name: Justin Dhinakar Moorthy
  label: Data Analyst
  summary: Data analyst working in Databricks with PySpark. I build pipelines for Tamil Nadu election data and write booth-level analysis of the results.

  social_networks:
    - network: GitHub
      username: justindhinakarmoorthy
    - network: X
      username: justinmoorthy

  sections:
    Projects:
      - name: "Madurantakam: Not Who Wins, but Where the Votes Move"
        date: 2026-09-24
        url: https://justindhinakarmoorthy.github.io/articles/madurantakam/
        summary: Part 1 of a two-part booth-level analysis of the Madurantakam (AC35) by-election, with interactive D3 charts.

      - name: Tamil Nadu 2026 assembly election results pipeline
        url: https://github.com/justindhinakarmoorthy/tamilnadu_assembly_election_results2026
        summary: Reproducible pipeline that extracts constituency-level results for all 234 Tamil Nadu assembly constituencies from the Election Commission of India, validates them, and builds a DuckDB warehouse with dbt.

      - name: Form 20 booth-level extraction, Dharapuram (AC101)
        url: https://github.com/justindhinakarmoorthy/form20_ac101_extraction
        summary: Staged Python pipeline that extracts booth-level votes per candidate from the Form 20 PDF, runs QA checks, and outputs a long-format table.

    Skills:
      - name: Data engineering
        keywords:
          - Databricks
          - PySpark
          - SQL
          - dbt
          - DuckDB
          - Python
          - pandas
